[platformio]
description=Smart_Intrusion_Detection_And_Remote_Email_Alert_System
default_envs = esp32dev


[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
upload_protocol = esptool
monitor_speed = 115200
board_build.filesystem = littlefs
lib_ldf_mode = deep+
build_flags =
    -I lib
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_ENABLE_PERIPHERAL_MANAGER=1

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags = -I lib
lib_deps =
    throwtheswitch/Unity@^2.6.1
