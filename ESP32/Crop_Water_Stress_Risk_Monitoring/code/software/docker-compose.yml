services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cws
      POSTGRES_USER: cws
      POSTGRES_PASSWORD: cws-development-only
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cws -d cws"]
      interval: 5s
      timeout: 5s
      retries: 10
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes: ["./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]
  api:
    build: .
    command: sh -c "npm run db:generate && npm run db:migrate && npm run dev -w @cws/api"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cws:cws-development-only@postgres:5432/cws?schema=public
      MQTT_BROKER_URL: mqtt://mosquitto:1883
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      mosquitto: { condition: service_started }
volumes:
  postgres_data:
