[platformio]
default_envs = esp32_wroom_32u

[env:esp32_wroom_32u]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_upload.maximum_size = 2097152
board_build.flash_size = 4MB
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@6.21.5
extra_scripts = pre:tools/build_assets.py
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra -DCORE_DEBUG_LEVEL=0 -Iinclude

[env:native]
platform = native@1.2.1
test_framework = unity
lib_deps = bblanchon/ArduinoJson@6.21.5
build_flags = -std=c++17 -Wall -Wextra -Iinclude -DUNITY_INCLUDE_DOUBLE
lib_compat_mode = off
lib_ignore = Sensors, Configuration, Security, Storage, Communication, LocalWebServer, Actuators, Display, System, Diagnostics
